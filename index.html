:root{
  --bg:#E8EBEF; --surface:#FFFFFF; --field:#F0F2F5; --ink:#17202B; --muted:#5B6676; --line:#D3D9E0;
  --red:#C8102E; --blue:#1F5BB5; --yellow:#C98F00; --green:#1F8A55;
  --tabs:58px; --danger:#C8102E; --on-accent:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13181E; --surface:#1C232C; --field:#262E38; --ink:#E8ECF1; --muted:#98A3B1; --line:#2E3742;
    --red:#E0384F; --blue:#6E9FEC; --yellow:#F0BE3A; --green:#3DB878; --danger:#EF4B61; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13181E; --surface:#1C232C; --field:#262E38; --ink:#E8ECF1; --muted:#98A3B1; --line:#2E3742;
  --red:#E0384F; --blue:#6E9FEC; --yellow:#F0BE3A; --green:#3DB878; --danger:#EF4B61; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* Text boxes draw their focus ring inside their own edge, so headers and card edges can never clip it. */
.field:focus-visible,.sel:focus-visible,.note-area:focus-visible,.set input:focus-visible,.cmp-pick .sel:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--blue)}
.field:focus,.sel:focus,.note-area:focus,.set input:focus{outline:none}
.field:focus,.note-area:focus,.set input:focus{box-shadow:inset 0 0 0 2px var(--blue)}
#pq{margin-top:4px}
.sheet .field,.sheet .sel,.sheet .note-area{scroll-margin-top:72px;scroll-margin-bottom:16px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.hd-ic{height:46px;width:auto;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
h1{display:flex;align-items:center;gap:10px;min-width:0;margin:0;white-space:nowrap;font-size:38px;line-height:1;font-weight:800;font-stretch:70%;letter-spacing:-.005em}
.icon-btn{width:44px;height:44px;border:0;border-radius:12px;background:var(--surface);color:var(--ink);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}

main{max-width:640px;margin:0 auto;padding:6px 16px calc(var(--tabs) + 40px)}
body.has-timer main{padding-bottom:calc(var(--tabs) + 130px)}
.sec{font-size:15px;font-weight:700;color:var(--muted);margin:28px 2px 10px}
.sec.first{margin-top:8px}
.note{font-size:14px;color:var(--muted);margin:8px 2px}
.note.pad{padding:28px 12px;text-align:center}

.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 16px;min-height:46px;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.primary{background:var(--ink);color:var(--bg);box-shadow:none}
.btn.big{width:100%;font-size:19px;padding:18px;font-weight:700}
.btn.wide{width:100%;margin-top:10px}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{color:var(--danger)}
.btn.danger-fill{background:var(--danger);color:#fff;box-shadow:none}
.btn.small{min-height:38px;padding:7px 14px;font-size:15px}
.btn.add{width:100%;margin-top:4px;background:transparent;box-shadow:none;border:1.5px dashed var(--line);color:var(--ink)}
.btn:disabled,.icon:disabled{opacity:.35}
.link{font:inherit;color:var(--blue);background:none;border:0;padding:0;font-weight:600;text-decoration:underline}
.hero{display:grid;gap:10px;margin-top:4px}

.plate{--c:var(--blue);width:16px;height:16px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--surface) 0 2.5px,transparent 3px),var(--c)}
.c-c{--c:var(--yellow)}
.c-t{--c:var(--green)}
.ln.t{stroke:var(--green)}
.pt.t{stroke:var(--green)}
.ro-sub{display:block;font-size:13px;color:var(--muted);font-weight:500}
.seg button:disabled{opacity:.35}
.c-b{--c:var(--blue);background:radial-gradient(circle,var(--surface) 0 4.5px,transparent 5px),var(--c)}
.lib-title .plate.c-b{background:radial-gradient(circle,var(--bg) 0 6px,transparent 6.5px),var(--c)}

.row{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:12px 12px 12px 16px;margin:8px 0;width:100%;text-align:left;font:inherit;color:inherit;border:0}
.row .grow{flex:1;min-width:0}
.row strong{display:block;font-size:17px;font-weight:700;overflow-wrap:anywhere}
.row small{display:block;color:var(--muted);font-size:14px}
.row svg{width:20px;height:20px;color:var(--muted);flex:none}
.empty{background:var(--surface);border-radius:14px;padding:16px}
.empty p{margin:0 0 12px;color:var(--muted)}
.mt{margin-top:12px}

/* Active workout */
.active-head{display:flex;align-items:center;gap:12px;margin:0 0 4px}
.wname{flex:1;min-width:0;font:inherit;font-size:22px;font-weight:700;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:6px 0}
.wname:focus{outline:none;border-bottom-color:var(--blue)}
main > .wname{width:100%;margin-bottom:10px}
.elapsed{font-size:24px;font-weight:800;font-stretch:70%;font-variant-numeric:tabular-nums;color:var(--muted)}
.rest-box{display:flex;align-items:center;gap:8px;margin:12px 0 8px}
.rest-box .sel{flex:1;margin:0;min-height:46px;padding:10px 12px}
.rest-lbl{font-size:14px;font-weight:700;color:var(--muted)}
.auto{display:flex;align-items:center;gap:10px;font-size:15px;margin:0 2px 6px}
.switch{-webkit-appearance:none;appearance:none;flex:none;margin:0;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(18px)}
.entry{background:var(--surface);border-radius:16px;padding:14px 12px 12px;margin:12px 0}
.entry-head{display:flex;align-items:center;gap:10px;padding-left:4px}
.entry-head{flex-wrap:wrap;row-gap:8px}
.entry-head h3{flex:1 1 0;min-width:min(100%,7.5em);margin:0;font-size:19px;font-weight:700;display:flex;align-items:baseline;gap:10px}
.entry-head h3 .plate{align-self:center}
.entry-head h3.long{flex-basis:100%}
.entry-ctl{display:flex;align-items:center;gap:10px;margin-left:auto}
.useg{display:flex;flex:none;gap:2px;padding:2px;border-radius:9px;background:var(--field)}
.useg button{font:inherit;font-size:13px;font-weight:700;border:0;background:none;color:var(--muted);padding:0 9px;min-height:32px;border-radius:7px}
.useg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.prev{font-size:14px;color:var(--muted);margin:4px 4px 8px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 46px 28px;gap:8px;align-items:center;padding:3px 0}
.set.head{font-size:13px;color:var(--muted);text-align:center;padding:4px 0 0}
.set button.n{font:inherit;font-weight:800;font-stretch:70%;font-size:18px;color:var(--ink);border:0;background:var(--field);box-shadow:inset 0 0 0 1.5px var(--line);padding:0;height:40px;border-radius:9px;cursor:pointer}
.set.wu button.n{box-shadow:inset 0 0 0 1.5px var(--yellow)}
.wu-hint{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin:6px 2px 0;line-height:1.35}
.wu-demo.w{color:var(--yellow);background:color-mix(in srgb,var(--yellow) 16%,var(--field));box-shadow:inset 0 0 0 1.5px var(--yellow)}
.wu-demo{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--field);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);font-weight:800;font-stretch:70%;font-size:14px}
.set.wu button.n{color:var(--yellow);background:color-mix(in srgb,var(--yellow) 16%,transparent)}
.set.wu input{opacity:.8}
.note.tip{background:var(--surface);border-radius:12px;padding:10px 12px;margin:10px 0}
.dow{display:flex;gap:6px}
.dow button{flex:1;min-width:0;height:44px;font:inherit;font-weight:700;border:0;border-radius:12px;background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.dow button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.rep-tag{display:block;font-size:12.5px;color:var(--blue);font-weight:600}
.set .n{font-weight:800;font-stretch:70%;font-size:18px;color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;font:inherit;font-size:20px;font-weight:700;font-stretch:80%;text-align:center;font-variant-numeric:tabular-nums;padding:8px 4px;border-radius:10px;border:0;background:var(--field);color:var(--ink)}
.set input::placeholder{color:var(--muted);opacity:.6;font-weight:600}
.chk{width:46px;height:42px;border:0;border-radius:10px;background:var(--field);color:var(--muted);display:grid;place-items:center}
.chk svg{width:22px;height:22px}
.set.done .chk{background:var(--green);color:#fff}
.set.done input{background:color-mix(in srgb,var(--green) 16%,var(--field))}
.del{width:28px;height:40px;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:0}
.entry .btn.small{margin-top:8px}
.rate{margin:18px 2px 0}
.extra-links{display:flex;margin:6px 0 0}
.extra-links + .extra-links{margin-top:0}
.extra-links .note-link{margin-top:0}
.rate .lbl{margin:0 0 4px}
.stars{display:flex;gap:2px;margin-left:-6px}
.star{width:48px;height:48px;border:0;background:none;padding:6px;color:var(--line);display:grid;place-items:center}
.star svg{width:32px;height:32px;fill:currentColor}
.star.on{color:#F5B400}
.hstars{margin-left:8px;font-size:14px;letter-spacing:1px;color:#F5B400;font-weight:400;white-space:nowrap}
.hstars i{font-style:normal;color:var(--line)}
.en-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.foot-links{display:flex;gap:16px}
.pc-row{display:flex;align-items:center;gap:10px}
.pc-row .field{font-size:28px;font-weight:800;font-stretch:75%;font-variant-numeric:tabular-nums;max-width:160px}
.pc-row span{font-weight:700;color:var(--muted);font-size:18px}
.pc-viz{padding:8px}
.pc-bar{fill:#9AA3AE}
.pc-collar{fill:#6E7783}
.pc-avail{display:flex;flex-wrap:wrap;gap:8px}
.pc-avail + .note-link{display:block}
.prows{background:var(--surface);border-radius:14px;padding:2px 8px 2px 14px;margin-top:6px}
.prow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow i{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.prow b{flex:1;font-weight:700;font-variant-numeric:tabular-nums}
.pc-row .btn{margin-left:auto}
.pc-tog{display:inline-flex;align-items:center;gap:7px;font:inherit;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;border:0;border-radius:999px;padding:8px 13px 8px 9px;min-height:40px;background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.pc-tog i{width:13px;height:13px;border-radius:50%;opacity:.35;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.pc-tog[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.pc-tog[aria-pressed="true"] i{opacity:1}
.pc-list{display:flex;flex-wrap:wrap;gap:8px}
.pc-chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:8px 14px 8px 10px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px var(--line)}
.pc-chip i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.pc-warn{margin:12px 2px;font-size:15px;color:var(--ink)}
.note-link{font-size:15px;padding:10px 4px;margin-top:8px;text-decoration:none}
main > .note-link{display:block;margin:14px 2px 0}
.note-area{display:block;width:100%;margin-top:8px;font:inherit;font-size:16px;line-height:1.4;padding:10px 12px;border-radius:10px;border:0;background:var(--field);color:var(--ink);resize:none;min-height:46px;overflow:hidden}
main > .note-area{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.prev-note{font-size:14px;color:var(--muted);margin:-4px 4px 8px;font-style:italic}
.hnote{display:block;font-style:italic;color:var(--muted);font-size:14px;margin-top:2px}
.hwnote{margin:0 0 10px;font-size:15px;color:var(--ink);font-style:italic}
.lib-note{margin:0 2px 8px;font-style:italic}
.finish-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.finish-row .btn{white-space:nowrap;padding-left:10px;padding-right:10px}
.finish-row.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.finish-row.three .btn{padding-left:6px;padding-right:6px;font-size:15px}
.bw-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 4px 2px}
.bw-row > span{font-size:13px;color:var(--muted)}
.zline{stroke:var(--muted);stroke-width:1.5;opacity:.7}
.icon{width:38px;height:38px;flex:none;border:0;border-radius:10px;background:var(--field);color:var(--ink);display:grid;place-items:center;font-size:17px;font-weight:700}
.icon svg{width:18px;height:18px}

/* Routines */
.ed-when{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) minmax(0,.7fr);gap:8px;margin:2px 0 6px}
.ed-when label{display:block;min-width:0}
.ed-when span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 2px 4px}
.ed-when .field{min-height:46px;padding:10px;font-size:16px;-webkit-appearance:none;appearance:none;display:block;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.ritem{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:8px 8px 8px 14px;margin:6px 0}
.ritem .grow{flex:1;min-width:0;font-weight:600}

/* Calendar */
.cal{background:var(--surface);border-radius:16px;padding:12px 8px 10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.cal-head h2{margin:0;font-size:24px;line-height:1;font-weight:800;font-stretch:72%}
.cal-head .icon{font-size:22px}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.cal-wd{border-bottom:1px solid var(--line);margin-bottom:4px}
.cal-wd span{font-size:12px;font-weight:700;color:var(--muted);padding:2px 0 8px}
.cd{font:inherit;border:0;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;min-width:0}
.cd-n{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.cd-c{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--field);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800}
.cd-c svg{width:16px;height:16px}
.cd.out{opacity:.4}
.cd.plan .cd-c{border:2.5px dashed var(--blue)}
.cd.done .cd-c{background:var(--green);border-color:var(--green)}
.cd.today .cd-n{color:var(--red);font-weight:800}
.cd.sel{background:var(--field)}
.cd.sel:not(.done):not(.plan) .cd-c{border-color:var(--line)}
.cal-legend{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:8px}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:13px;height:13px;border-radius:50%;display:inline-block}
.lg .d{background:var(--green)}
.lg .p{border:2px dashed var(--blue)}
.pring{width:18px;height:18px;border-radius:50%;border:2.5px dashed var(--blue);flex:none}
.pring.ok{border:0;background:var(--green)}
.psub{display:block;color:var(--muted);font-size:14px}
.plist strong{display:block;font-weight:600}

/* Theme picker */
.themes{display:grid;gap:8px}
.theme{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:0;border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;box-shadow:inset 0 0 0 1px var(--line)}
.theme[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--red)}
.theme .tn{flex:1;min-width:0}
.theme strong{display:block;font-weight:700}
.theme small{display:block;color:var(--muted);font-size:13.5px}
.sw{display:flex;flex:none;padding-left:6px}
.sw i{width:22px;height:22px;border-radius:50%;margin-left:-6px;box-shadow:0 0 0 2.5px var(--surface)}

/* Weekly goal */
.bk-card{background:color-mix(in srgb,var(--red) 13%,var(--surface));border-radius:14px;padding:12px 14px;margin:4px 0 10px;display:flex;flex-direction:column;gap:2px}
.bk-card span{font-size:14px;color:var(--ink)}
.bk-card .finish-row{margin-top:10px}
.bk-status{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;margin-bottom:4px}
.bk-status.due{box-shadow:inset 0 0 0 2px var(--red)}
.bk-status span{font-size:14px;color:var(--muted)}
.due-txt{color:var(--red)!important;font-weight:600}
.btn.bk-opt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:3px;padding:12px 14px;white-space:normal;margin-top:8px}
.btn.bk-opt small{font-size:13.5px;font-weight:500;color:var(--muted);line-height:1.35}
.bk-file-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.warn-card{background:color-mix(in srgb,var(--danger) 14%,var(--surface));border-radius:14px;padding:12px 14px;margin:4px 0 10px;display:flex;flex-direction:column;gap:2px}
.warn-card b{color:var(--danger)}
.warn-card span{font-size:14px;color:var(--ink)}
.goal-card{background:var(--surface);border-radius:16px;padding:14px 16px;margin:4px 0 6px}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.goal-top b{font-size:17px}
.goal-top span{font-weight:800;font-stretch:75%;font-size:20px;font-variant-numeric:tabular-nums}
.goal-bar{display:flex;gap:5px;margin:10px 0 8px}
.goal-bar i{flex:1;height:10px;border-radius:5px;background:var(--field)}
.goal-bar i.on{background:var(--green)}
.goal-bar i.extra.on{opacity:.65}
.goal-card p{margin:0;color:var(--muted);font-size:14.5px}
.goal-card.met p{color:var(--ink)}
.goal-line{stroke:var(--green);stroke-width:1.5;stroke-dasharray:5 4}
.goal-lbl{fill:var(--green);font-weight:700}

/* Photo compare */
.cmp-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cmp-pick span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 2px 4px}
.cmp-pick .sel{margin:0;font-size:15px;padding:10px}
.cmp-view{margin-top:12px}
.cmp-side{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cmp-side figure{margin:0}
.cmp-side img,.cmp-slide img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--field)}
.cmp-side figcaption{font-size:13px;color:var(--muted);margin:5px 2px 0;text-align:center}
.cmp-slide{position:relative;border-radius:12px;overflow:hidden}
.cmp-top{position:absolute;inset:0;clip-path:inset(0 0 0 var(--pos))}
.cmp-top img{border-radius:0;height:100%}
.cmp-line{position:absolute;top:0;bottom:0;left:var(--pos);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.5);pointer-events:none}
.cmp-tag{position:absolute;bottom:8px;font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:999px}
.cmp-tag.l{left:8px}
.cmp-tag.r{right:8px}
.cmp-range{width:100%;margin:12px 0 2px;accent-color:var(--red)}

/* Photos */
.ptabs{margin:2px 0 18px}
.ph-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.ph-form .field{min-height:46px;padding:10px 12px;min-width:0;-webkit-appearance:none;appearance:none;display:block;font-size:16px}
.ph-pick{position:relative;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ph-pick:focus-within{outline:3px solid var(--blue);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.ph-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ph{border:0;padding:0;background:none;font:inherit;color:var(--muted);text-align:left;min-width:0}
.ph img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--field)}
.ph span{display:block;font-size:12.5px;margin:4px 2px 8px}
.ph-full img{display:block;width:100%;max-height:68vh;object-fit:contain;border-radius:12px;background:var(--field);min-height:200px}
img.missing{opacity:.4}

/* History */
.hist{background:var(--surface);border-radius:14px;margin:8px 0;overflow:hidden}
.hist-head{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:0;background:none;color:inherit;font:inherit;text-align:left}
.hdate{width:42px;flex:none;text-align:center;line-height:1}
.hdate b{display:block;font-size:32px;font-weight:800;font-stretch:66%}
.hdate small{font-size:12px;color:var(--muted)}
.hmain{flex:1;min-width:0}
.hmain strong{display:block;font-weight:700;font-size:17px}
.hmain small{display:block;color:var(--muted);font-size:14px}
.chev{width:20px;height:20px;color:var(--muted);flex:none;transition:transform .2s}
[aria-expanded="true"] .chev{transform:rotate(180deg)}
.hbody{padding:0 14px 14px 70px}
.hline{display:flex;gap:10px;margin:8px 0}
.hline .plate{margin-top:4px}
.hline b{display:block;font-weight:600}
.hline small{display:block;color:var(--muted);font-size:14px}
.hbody .finish-row{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.hbody .finish-row .btn{flex:1 1 auto;white-space:nowrap}
@media (max-width:360px){h1{font-size:28px;gap:7px}.hd-ic{height:34px}.entry-head h3{font-size:18px}.hbody{padding-left:14px}.ed-when{grid-template-columns:1fr 1fr}.ed-when label:last-child{grid-column:1 / -1}}

/* Progress */
.chart{background:var(--surface);border-radius:14px;padding:10px 8px 2px;margin-top:10px}
.chart svg{display:block;width:100%;height:auto}
svg text{fill:var(--muted);font-size:10px;font-family:inherit}
svg .val{fill:var(--ink);font-weight:700;font-size:11px}
.grid{stroke:var(--line);stroke-width:1}
.ln{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ln.c{stroke:var(--yellow)}
.pt{fill:var(--surface);stroke:var(--blue);stroke-width:2}
.pt.c{stroke:var(--yellow)}
.ln.b{stroke:var(--ink)}
.pt.b{stroke:var(--ink)}
.bw-form{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) auto auto;gap:8px;align-items:center}
.bw-form .field{min-height:46px;padding:10px 12px;min-width:0}
.bw-form input[type="date"]{-webkit-appearance:none;appearance:none;display:block;font-size:16px}
.bw-unit{font-weight:600;color:var(--muted)}
.bw-list{background:var(--surface);border-radius:14px;margin-top:10px;padding:2px 6px 2px 14px}
.bw-item{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.bw-item:last-child{border-bottom:0}
.bw-item span{flex:1;color:var(--muted);font-size:15px}
.bw-item b{font-size:18px;font-weight:700;font-stretch:80%;font-variant-numeric:tabular-nums}
.plab{fill:var(--muted);font-weight:700;font-size:10.5px}
svg .tick{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
svg .val.big{font-size:12.5px}
svg .dimt{fill:var(--muted);font-weight:500}
.grid.faint{opacity:.55}
.pt.on{stroke-width:3}
.guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:.55}
.rbar{fill:var(--blue);opacity:.35}
.rbar.c{fill:var(--yellow)}
.rbar.on{opacity:1}
.rbar.prb{opacity:.75;fill:var(--red)}
.rbar.prb.on{opacity:1}
.pt.pr{fill:var(--red);stroke:var(--red)}
.pt.on{stroke-width:3}
svg .val.dim{font-weight:600;fill:var(--muted)}
.hit{fill:transparent;cursor:pointer}
.sel-info{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin:14px 2px 0;font-size:16px}
.sel-info b{font-weight:700}
.prtag{font-size:12px;font-weight:800;line-height:1;color:var(--on-accent);background:var(--red);padding:4px 8px;border-radius:999px}
.prdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);vertical-align:-1px}
.bar{fill:var(--ink)}
.bar.now{fill:var(--red)}
.bar.zero{fill:var(--line)}
.sel{width:100%;font:inherit;font-size:17px;font-weight:600;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:10px}
.seg{display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:600;border:0;border-radius:9px;background:transparent;color:var(--muted);padding:8px 4px;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rec{background:var(--surface);border-radius:12px;padding:10px 12px}
.rec b{display:block;font-size:22px;line-height:1.1;font-weight:800;font-stretch:70%}
.rec small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabs)}
.tab{position:relative;font:inherit;font-size:11.5px;font-weight:600;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--red)}

/* Rest timer — the one loud thing */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--tabs) + env(safe-area-inset-bottom,0px));z-index:19;padding:0 10px 10px}
.timer-in{max-width:620px;margin:0 auto;background:var(--red);color:var(--on-accent);border-radius:18px;overflow:hidden;box-shadow:0 10px 28px color-mix(in srgb,var(--red) 35%,transparent)}
.tprog{height:5px;background:color-mix(in srgb,var(--on-accent) 25%,transparent)}
.tprog i{display:block;height:100%;background:var(--on-accent);transform-origin:left;transition:transform .25s linear}
.trow{display:flex;align-items:center;gap:8px;padding:8px 10px 10px 16px}
.tleft{flex:1;line-height:1}
.tleft small{display:block;font-size:13px;font-weight:600;opacity:.88;margin-bottom:2px}
.tleft span{font-size:44px;font-weight:800;font-stretch:64%;font-variant-numeric:tabular-nums}
.tbtn{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:11px;background:color-mix(in srgb,var(--on-accent) 20%,transparent);color:var(--on-accent);min-width:52px;height:46px;padding:0 10px}
.timer.done .timer-in{background:var(--green);box-shadow:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs) + env(safe-area-inset-bottom,0px) + 16px);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:16px;font-weight:600;font-size:15px;width:max-content;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.toast.pr{width:min(340px,calc(100% - 32px));background:var(--red);color:var(--on-accent);border-radius:18px;padding:12px 18px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 10px 30px color-mix(in srgb,var(--red) 40%,transparent)}
.toast.pr b{font-size:17px}
.toast.pr span{font-size:14px;font-weight:600;opacity:.92}
.ex-name{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;display:inline;cursor:pointer;overflow-wrap:anywhere}
.nw{white-space:nowrap}
.ex-name svg{width:18px;height:18px;color:var(--muted);vertical-align:-3px;margin-left:1px}
.entry.ss-top{border-bottom-left-radius:6px;border-bottom-right-radius:6px;margin-bottom:0;box-shadow:inset 4px 0 0 var(--blue)}
.entry.ss-bot{border-top-left-radius:6px;border-top-right-radius:6px;margin-top:0;box-shadow:inset 4px 0 0 var(--blue)}
.ss-join{background:var(--surface);color:var(--blue);font-size:12.5px;font-weight:800;text-align:center;padding:3px 0 2px;box-shadow:inset 4px 0 0 var(--blue);border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.ss-link{display:flex;justify-content:center;margin:-2px 0}
.ss-link button{font:inherit;font-size:13px;font-weight:700;border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:999px}
.ss-link button.on{color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent)}
.ritem.ss-a{border-bottom-left-radius:4px;border-bottom-right-radius:4px;box-shadow:inset 4px 0 0 var(--blue)}
.ritem.ss-b{border-top-left-radius:4px;border-top-right-radius:4px;box-shadow:inset 4px 0 0 var(--blue)}
.btn.repeat{display:flex;flex-direction:column;align-items:center;gap:1px;margin-top:0}
.btn.repeat small{font-size:13px;font-weight:500;color:var(--muted)}
body.has-timer .toast{bottom:calc(var(--tabs) + env(safe-area-inset-bottom,0px) + 100px)}

/* Sheets */
.backdrop{position:fixed;inset:0;z-index:30;background:rgba(8,12,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet:focus{outline:none}
.backdrop.kb .sheet{max-height:100%;border-radius:18px 18px 0 0;padding-bottom:12px}
.backdrop.kb .sheet-head{padding-top:12px}
.sheet{width:100%;max-width:640px;max-height:88%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-head{position:sticky;top:0;z-index:1;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px}
.sheet h2{margin:0;font-size:28px;line-height:1;font-weight:800;font-stretch:70%}
.sheet p{margin:6px 0 12px}
.sheet .row{margin:4px 0 14px}
.sheet-head .back{padding-left:4px;padding-right:8px}
.field{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.area{font-size:13px;font-family:ui-monospace,Menlo,monospace;resize:vertical;margin-bottom:6px}
.plist{margin-top:8px}
.plabel{font-size:14px;font-weight:700;color:var(--muted);margin:16px 2px 6px}
.plist button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:17px;padding:12px 14px;margin:4px 0;border:0;border-radius:12px;background:var(--surface);color:var(--ink)}
.create{background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:14px}
.create .finish-row{margin-top:8px}
.setting{margin:14px 0}
.plist button svg{width:18px;height:18px;color:var(--muted);flex:none}
.plist .grow{flex:1;min-width:0}
.lib-title{display:flex;align-items:center;gap:12px;margin:4px 2px 12px}
.lib-title .plate{width:22px;height:22px;background:radial-gradient(circle,var(--bg) 0 3.5px,transparent 4px),var(--c)}
.lib-title strong{display:block;font-size:22px;font-weight:700;line-height:1.2}
.lib-title small{display:block;color:var(--muted);font-size:14px}
.lbl{display:block;font-weight:600;margin:0 2px 6px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<header class="top"><div class="top-in">

</div></header>

<nav class="tabs" aria-label="Sections"><div class="tabs-in">

  <button class="tab" data-a="go" data-t="routines"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="17.5" r="1" fill="currentColor"/></svg>Routines</button>
  <button class="tab" data-a="go" data-t="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</button>
  <button class="tab" data-a="go" data-t="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5V19.5h16"/><path d="M7.5 15l4-4.5 3 3 5-6"/></svg>Progress</button>
</div></nav>

<div class="backdrop" id="backdrop" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>

<script>
(() => {
'use strict';
const KEY = 'training-log-v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',

  chevRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 7l5 5-5 5"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>'

const SEED = [
  ['Bench press','s'],['Squat','s'],['Deadlift','s'],['Overhead press','s'],['Barbell row','s'],['Pull-up','b'],
  ['Push-up','b'],['Chin-up','b'],['Dip','b'],['Lat pulldown','s'],['Leg press','s'],['Romanian deadlift','s'],['Dumbbell curl','s'],
  ['Triceps pushdown','s'],['Lunge','s'],['Plank','t'],['Wall sit','t'],['Dead hang','t'],
  ['Run','c'],['Cycling','c'],['Rowing machine','c'],['Walk','c'],['Elliptical','c'],['Swim','c'],['Stair climber','c']

function fresh() {
  const exercises = SEED.map(([name, t]) => ({ id: uid(), name, type: t === 's' ? 'strength' : t === 'b' ? 'bodyweight' : t === 't' ? 'timed' : 'cardio' }));
  const by = n => exercises.find(e => e.name === n).id;
  return {
    v: 4, exercises, workouts: [], bodyweight: [], plans: [], photos: [], active: null, timer: null,
    settings: { unit: 'lb', dist: 'mi', rest: 90, autoRest: true, trackBW: false, goal: 0, prAlerts: true, timerSound: 'on', keepAwake: 'workout', remind: 14, backupPhotos: true, theme: 'dark', accent: 'babyfood', hintRound: 'match', bar: { lb: 45, kg: 20 }, plates: { lb: [45, 25, 10, 5, 2.5], kg: [25, 20, 15, 10, 5, 2.5, 1.25] }, plateList: { lb: [45, 35, 25, 15, 10, 5, 2.5], kg: [25, 20, 15, 10, 5, 2.5, 1.25, 0.5] } },
    routines: [
      { id: uid(), name: 'Full body', items: [by('Squat'), by('Bench press'), by('Barbell row')] },
      { id: uid(), name: 'Cardio day', items: [by('Run'), by('Rowing machine')] }
    ]
  };
}
function normalize(d) {
  d.routines = Array.isArray(d.routines) ? d.routines : [];
  d.bodyweight = Array.isArray(d.bodyweight) ? d.bodyweight : [];
  d.plans = Array.isArray(d.plans) ? d.plans : [];
  d.photos = Array.isArray(d.photos) ? d.photos : [];
  d.settings = Object.assign({ unit: 'lb', dist: 'mi', rest: 90 }, d.settings || {});
  if (typeof d.settings.autoRest !== 'boolean') d.settings.autoRest = d.settings.rest > 0;
  if (!(d.settings.rest > 0)) d.settings.rest = 90;
  if (typeof d.settings.trackBW !== 'boolean') d.settings.trackBW = false;
  if (typeof d.settings.trackPhotos !== 'boolean') d.settings.trackPhotos = false;
  if (!(d.settings.goal >= 0 && d.settings.goal <= 7)) d.settings.goal = 0;
  if (typeof d.settings.prAlerts !== 'boolean') d.settings.prAlerts = true;
  if (!['on', 'silent', 'off'].includes(d.settings.timerSound)) d.settings.timerSound = 'on';
  if (!['workout', 'always', 'off'].includes(d.settings.keepAwake)) d.settings.keepAwake = 'workout';
  if (![0, 7, 14, 30].includes(d.settings.remind)) d.settings.remind = 14;
  if (typeof d.settings.backupPhotos !== 'boolean') d.settings.backupPhotos = true;
  d.settings.bar = Object.assign({ lb: 45, kg: 20 }, d.settings.bar || {});
  if (!['match', 'plate', 'whole'].includes(d.settings.hintRound)) d.settings.hintRound = 'match';
  d.settings.plates = Object.assign({ lb: [45, 25, 10, 5, 2.5], kg: [25, 20, 15, 10, 5, 2.5, 1.25] }, d.settings.plates || {});
  d.settings.plateList = Object.assign({ lb: [45, 35, 25, 15, 10, 5, 2.5], kg: [25, 20, 15, 10, 5, 2.5, 1.25, 0.5] }, d.settings.plateList || {});
  if (d.settings.theme !== 'light') d.settings.theme = 'dark';
  if (!window.THEMES.some(t => t.id === d.settings.accent)) d.settings.accent = 'babyfood';
  d.active = d.active || null;
  // Tag every entry with the unit it was logged in (older data used the current setting).
  const u0 = d.settings.unit === 'kg' ? 'kg' : 'lb', d0 = d.settings.dist === 'km' ? 'km' : 'mi';
  const tag = w => { for (const en of (w && w.entries) || []) { if (!en.u) en.u = u0; if (!en.du) en.du = d0; } };
  (d.workouts || []).forEach(tag); tag(d.active);
  d.bodyweight.forEach(e => { if (!e.u) e.u = u0; });

  if ((d.v || 1) < 2) {
    for (const e of d.exercises) if (e.type === 'strength' && ['pull-up', 'push-up', 'chin-up', 'dip'].includes(e.name.toLowerCase())) e.type = 'bodyweight';
    for (const n of ['Chin-up', 'Dip']) if (!d.exercises.some(e => e.name.toLowerCase() === n.toLowerCase())) d.exercises.push({ id: uid(), name: n, type: 'bodyweight' });
    d.v = 2;
  }
  // v3: timed exercise type (plank, wall sit, dead hang) logged as minutes and seconds.
  if (d.v < 3) {
    const logged = id => [...(d.workouts || []), d.active].some(w => w && (w.entries || []).some(e => e.ex === id && e.sets.length));
    for (const e of d.exercises) if (e.type === 'strength' && e.name.toLowerCase() === 'plank' && !logged(e.id)) e.type = 'timed';
    for (const n of ['Wall sit', 'Dead hang']) if (!d.exercises.some(e => e.name.toLowerCase() === n.toLowerCase())) d.exercises.push({ id: uid(), name: n, type: 'timed' });

  // (Runs after the older upgrades above, so restoring an old backup still gets every step.)
  if ((d.v || 1) < 4) { if (d.settings.accent === 'plates') d.settings.accent = 'babyfood'; d.v = 4; }

}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.exercises) && Array.isArray(d.workouts)) return normalize(d); }

  return fresh();
}
let S = load(), storageOk = true;
try { localStorage.setItem('training-log-probe', '1'); localStorage.removeItem('training-log-probe'); } catch (e) { storageOk = false; }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { if (storageOk) { storageOk = false; toast('Can’t save on this device. Changes last until you close the page.'); if (tab === 'log' && !S.active) setTimeout(render, 0); } }
}

let histLimit = 30, bwAll = false, planDate = null, progView = 'charts';
let editW = null; // a past workout being edited, or a new one being logged after the fact (Calendar tab)
const curW = () => (tab === 'history' && editW) ? editW : S.active;
let tab = 'log', draft = null, picker = null, confirmFn = null, lastFocus = null, doneUntil = 0;
const expanded = new Set();
const prog = { ex: null, metric: null, sel: null };

const exById = id => S.exercises.find(e => e.id === id) || { id, name: 'Removed exercise', type: 'strength' };
const isBW = ex => ex.type === 'bodyweight';
const isStr = ex => ex.type === 'strength' || ex.type === 'bodyweight';
const isTimed = ex => ex.type === 'timed';
const plateCls = ex => ex.type === 'cardio' ? 'c-c' : ex.type === 'bodyweight' ? 'c-b' : ex.type === 'timed' ? 'c-t' : '';
const TYPE_LABEL = { strength: 'Strength', bodyweight: 'Bodyweight', timed: 'Timed', cardio: 'Cardio' };
const TYPE_ORDER = [['strength', 'Strength'], ['bodyweight', 'Bodyweight'], ['timed', 'Timed'], ['cardio', 'Cardio']];
const hasVal = s => ['w', 'r', 'min', 'dist', 'tm', 'ts'].some(k => s[k] != null && s[k] !== '');
// Timed sets store minutes (tm) and seconds (ts).
const holdSec = s => (num(s.tm) || 0) * 60 + (num(s.ts) || 0);
const fmtHold = sec => fmtClock(sec * 1000);
// Most recent note left on an exercise (respects the "before this workout" rule when editing).
function lastNote(exId) {
  const ed = tab === 'history' && editW ? editW : null, before = ed ? editStart(ed) : Infinity;
  for (const w of S.workouts) {
    if (ed && (w.id === ed.id || w.start >= before)) continue;
    const en = w.entries.find(e => e.ex === exId && e.note); if (en) return { note: en.note, when: w.start };

const noteArea = (f, i, v, label) => `<textarea class="note-area" data-f="${f}"${i != null ? ` data-i="${i}"` : ''} rows="2" placeholder="${label}" aria-label="${label}">${esc(v || '')}</textarea>`;
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg>';
function ratingHTML(W) {
  const r = W.rating || 0;
  if (W.rating == null) return '';
  return `<div class="rate"><span class="lbl">How was this workout?</span><div class="stars" role="radiogroup" aria-label="Workout rating">${[1, 2, 3, 4, 5].map(n => `<button class="star${n <= r ? ' on' : ''}" data-a="rate" data-v="${n}" role="radio" aria-checked="${n === r}" aria-label="${n} star${n > 1 ? 's' : ''}">${STAR}</button>`).join('')}</div></div>`;
}
const starText = r => r ? `<span class="hstars" aria-label="Rated ${r} out of 5">${'★'.repeat(r)}<i>${'★'.repeat(5 - r)}</i></span>` : '';
function unlinkAround(W, a, b) { for (const k of [a - 1, a, b]) if (W.entries[k]) delete W.entries[k].ssNext; }
// Drop empty exercises, and keep a superset link only if the exercise it pointed to is kept too.
function keepLinks(list) {
  const kept = list.map((en, i) => ({ en, i })).filter(x => x.en.sets.length);
  return kept.map((x, k) => { const e = x.en; if (e.ssNext && !(kept[k + 1] && kept[k + 1].i === x.i + 1)) delete e.ssNext; return e; });
}
function openExHistory(id) {
  const ex = exById(id), u = S.settings.unit, du = S.settings.dist;
  const sess = S.workouts.filter(w => w.entries.some(e => e.ex === id)).slice(0, 5);
  let chart = '';
  if (isStr(ex) || ex.type === 'cardio') {
    const kind = isBW(ex) ? 'b' : isStr(ex) ? 'w' : 'c';
    const days = bestDays(id, kind).slice(-12);
    if (days.length > 1) chart = `<div class="chart">${pairChart(days, kind === 'c' ? { top: x => x.D, topLabel: `Distance (${du})`, bar: x => x.M, barLabel: 'Time (min)', cls: 'c' } : { top: x => x.W, topLabel: kind === 'b' ? `Load (${u})` : `Heaviest weight (${u})`, bar: x => x.R, barLabel: 'Reps', cls: '', zero: kind === 'b' }, days.length - 1, true)}</div>`;
  } else if (isTimed(ex)) {

  }

}
function openReorder() {
  const W = curW(); if (!W) return;
  const n = W.entries.length;
  openSheet(`${head('Reorder & superset')}<p class="note">Move exercises up or down. To superset two exercises, tap “Superset” between them. The rest timer then waits until you’ve done a set of each.</p>
    ${W.entries.map((en, i) => { const ex = exById(en.ex), done = en.sets.filter(x => x.done).length;
      const item = `<div class="ritem${en.ssNext ? ' ss-a' : ''}${i > 0 && W.entries[i - 1].ssNext ? ' ss-b' : ''}"><span class="plate ${plateCls(ex)}"></span><span class="grow">${esc(ex.name)}${done ? `<small class="ro-sub">${done} ${done === 1 ? 'set' : 'sets'} done</small>` : ''}</span>
      <button class="icon" data-a="ro-up" data-i="${i}" aria-label="Move ${esc(ex.name)} up"${i === 0 ? ' disabled' : ''}>↑</button>
      <button class="icon" data-a="ro-down" data-i="${i}" aria-label="Move ${esc(ex.name)} down"${i === n - 1 ? ' disabled' : ''}>↓</button></div>`;
      const link = i < n - 1 ? `<div class="ss-link"><button class="${en.ssNext ? 'on' : ''}" data-a="ss-toggle" data-i="${i}" aria-pressed="${!!en.ssNext}">${en.ssNext ? 'Superset (tap to unlink)' : '+ Superset'}</button></div>` : '';

function workoutNoteHTML(W) {
  return W.note != null ? `<h3 class="plabel">Workout notes</h3>${noteArea('wnote', null, W.note, 'How did it go? Anything to remember?')}` : '';
}
// Rating and workout notes stay hidden behind links until you want them.
function workoutExtras(W) {
  // Fixed order: Reorder, then rating (link or stars), then notes (link or box).
  const link = (a, t) => `<div class="extra-links"><button class="link note-link" data-a="${a}">${t}</button></div>`;
  return (W.entries.length > 1 ? link('reorder', 'Reorder or superset') : '')
    + (W.rating == null ? link('rate-open', 'Add rating') : ratingHTML(W))
    + (W.note == null ? link('wnote-open', 'Add workout notes') : workoutNoteHTML(W));
}
function lastEntry(exId) {
  const ed = tab === 'history' && editW ? editW : null, before = ed ? editStart(ed) : Infinity;
  for (const w of S.workouts) {
    if (ed && (w.id === ed.id || w.start >= before)) continue;
    const en = w.entries.find(e => e.ex === exId); if (en && en.sets.length) return en;
  }
  return null;

/* Units: each entry remembers the unit it was logged in; displays convert to the preferred unit. */
const KG = 0.45359237, KM = 1.609344;
const cw = (v, from, to) => v == null ? null : from === to ? v : from === 'kg' ? v / KG : v * KG;
const cd = (v, from, to) => v == null ? null : from === to ? v : from === 'km' ? v / KM : v * KM;
const enU = en => (en && en.u) || S.settings.unit;
const enDU = en => (en && en.du) || S.settings.dist;
// Converted weights round to whole numbers (70.5 → 71, 70.4 → 70); converted distances to two decimals.
const rw = (v, from, to) => v == null ? null : from === to ? v : Math.round(cw(v, from, to));
const rd = (v, from, to) => v == null ? null : from === to ? v : Math.round(cd(v, from, to) * 100) / 100;
const wPref = (s, en) => rw(num(s.w), enU(en), S.settings.unit);

const loadPref = (s, en) => { const W = wPref(s, en) || 0; return enLoad(en) === 'assist' ? -W : W; };

function fmtSetLong(s, ex, en) {
  if (isTimed(ex)) return `${fmtHold(holdSec(s))} hold`;
  if (s.wu) { const c = { ...s }; delete c.wu; return 'warm-up ' + fmtSetLong(c, ex, en); }
  const pu = S.settings.unit, pd = S.settings.dist;
  if (isBW(ex)) {
    if (!num(s.w)) return `${s.r || 0} reps`;
    const eu = enU(en), sg = enLoad(en) === 'assist' ? '−' : '+', base = `${sg}${s.w} ${eu} × ${s.r || 0}`;
    return eu === pu ? base : `${base} (${sg}${fmtN(wPref(s, en), 0)} ${pu})`;
  }
  if (isStr(ex)) {
    if (!s.w) return `${s.r || 0} reps`;
    const eu = enU(en), base = `${s.w} ${eu} × ${s.r || 0}`;
    return eu === pu ? base : `${base} (${fmtN(wPref(s, en), 0)} ${pu})`;
  }
  const ed = enDU(en);
  const dist = s.dist ? `${s.dist} ${ed}${ed !== pd ? ` (${fmtN(dPref(s, en), 2)} ${pd})` : ''}` : '';
  return [dist, s.min ? `${s.min} min` : ''].filter(Boolean).join(' in ');
}
function summary(w) {
  const p = [], u = S.settings.unit, du = S.settings.dist;
  if (w.end) p.push(`${Math.max(1, Math.round((w.end - w.start) / 60000))} min`);
  p.push(`${w.entries.length} ${w.entries.length === 1 ? 'exercise' : 'exercises'}`);
  let vol = 0, dist = 0;
  for (const en of w.entries) for (const s of en.sets) { if (s.wu) continue; const W = enLoad(en) === 'assist' ? null : wPref(s, en), R = num(s.r); if (W > 0 && R > 0) vol += W * R; dist += dPref(s, en) || 0; }
  if (vol) p.push(`${fmtN(vol, 0)} ${u} lifted`);
  if (dist) p.push(`${fmtN(dist, 2)} ${du}`);
  return p.join(', ');
}
function dayStart(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function relDay(t) {
  const diff = Math.round((dayStart(Date.now()) - dayStart(t)) / 864e5);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return new Date(t).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function defaultName() { const h = new Date().getHours(); return h < 11 ? 'Morning workout' : h < 17 ? 'Afternoon workout' : 'Evening workout'; }

const TITLES = { log: 'Today', routines: 'Routines', history: 'Calendar', progress: 'Progress' };
function render() {
  let title = TITLES[tab];
  if (tab === 'log' && S.active) title = 'Workout';
  if (tab === 'history' && editW) title = editW.isNew ? 'Log workout' : 'Edit workout';
  if (tab === 'routines' && draft) title = draft.id ? 'Edit routine' : 'New routine';
  // Every page title gets the Baby Food bottle mascot next to it.
  $('#title').innerHTML = `<img class="hd-ic" src="${MASCOT}" alt=""><span>${esc(title)}</span>`;
  $('#view').innerHTML = tab === 'log' ? (S.active ? viewActive() : viewIdle()) : tab === 'routines' ? viewRoutines() : tab === 'history' ? viewHistory() : viewProgress();
  document.querySelectorAll('.tab').forEach(t => t.dataset.t === tab ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current'));
  tick();
  loadPhotos();
  document.querySelectorAll('.note-area').forEach(grow);
  syncWake();

function go(t) { tab = t; render(); window.scrollTo(0, 0); }

  'new-routine': () => { draft = { id: null, name: '', items: [] }; render(); },
  'edit-routine': b => { const r = S.routines.find(x => x.id === b.dataset.id); if (r) { draft = { id: r.id, name: r.name, items: [...r.items] }; render(); } },
  'r-up': b => { const i = +b.dataset.i; if (i > 0) { [draft.items[i - 1], draft.items[i]] = [draft.items[i], draft.items[i - 1]]; render(); } },
  'r-down': b => { const i = +b.dataset.i; if (i < draft.items.length - 1) { [draft.items[i + 1], draft.items[i]] = [draft.items[i], draft.items[i + 1]]; render(); } },
  'r-rm': b => { draft.items.splice(+b.dataset.i, 1); render(); },
  'r-add': () => openPicker(id => { draft.items.push(id); render(); }),
  'r-save': () => {
    if (!draft.items.length) { toast('Add at least one exercise'); return; }
    const name = draft.name.trim() || 'Untitled routine';
    const ex = S.routines.find(r => r.id === draft.id);

  },
  'r-cancel': () => { draft = null; render(); },
  'r-delete': () => askConfirm(`Delete “${draft.name || 'this routine'}”? Your workout history stays.`, 'Delete routine', () => { S.routines = S.routines.filter(r => r.id !== draft.id); draft = null; save(); render(); }),
  toggle: b => { const id = b.dataset.id; expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); },
  'open-hist': b => { const w = S.workouts.find(x => x.id === b.dataset.id); if (w) { calTo(dstr(new Date(w.start))); expanded.add('d:' + w.id); } go('history'); },
  'edit-workout': b => {
    const w = S.workouts.find(x => x.id === b.dataset.id); if (!w) return;
    const st = new Date(w.start);
    editW = { ...JSON.parse(JSON.stringify(w)), _date: dstr(st), _time: `${pad(st.getHours())}:${pad(st.getMinutes())}`, _dur: String(w.end ? Math.max(1, Math.round((w.end - w.start) / 6e4)) : 60) };
    go('history');
  },
  'log-new': () => {
    const t = todayStr(), now = new Date(Date.now() - 36e5);
    editW = { id: uid(), name: '', entries: [], isNew: true, _date: calSel || t, _time: calSel === t ? `${pad(now.getHours())}:${pad(Math.floor(now.getMinutes() / 5) * 5)}` : '18:00', _dur: '60' };
    go('history');
  },
  'log-fill': b => {
    const r = S.routines.find(x => x.id === b.dataset.id); if (!r || !editW) return;
    editW.entries = r.items.filter(id => S.exercises.some(e => e.id === id && !e.deleted)).map(newEntry);
    editW.routine = r.id; if (!editW.name.trim()) editW.name = r.name; render();
  },
  'edit-cancel': () => {
    const leave = () => { const d = editW && editW._date; editW = null; if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) calTo(d); render(); };
    editW && editW.isNew && editW.entries.some(en => en.sets.some(hasVal)) ? askConfirm('This workout won’t be saved.', 'Discard', leave) : leave();
  },
  'edit-save': () => {
    const w = editW, t = todayStr(), start = editStart(w);
    if (!Number.isFinite(start)) { toast('Pick a date first'); return; }
    if (w._date > t) { toast('That date is in the future. Plan it instead.'); return; }
    const dur = num(w._dur) == null ? 60 : Math.min(600, Math.max(1, num(w._dur)));
    const entries = keepLinks(w.entries.map(en => ({ ex: en.ex, u: enU(en), du: enDU(en), ...(en.load ? { load: en.load } : {}), ...(en.note && en.note.trim() ? { note: en.note.trim() } : {}), ...(en.ssNext ? { ssNext: true } : {}), sets: en.sets.filter(hasVal).map(x => ({ ...x, done: true })) })));
    if (!entries.length) { toast('Add at least one set first'); return; }
    const orig = S.workouts.find(x => x.id === w.id) || {};
    const out = { ...orig, id: w.id, name: (w.name || '').trim() || (w.routine && (S.routines.find(r => r.id === w.routine) || {}).name) || 'Workout', start, end: start + dur * 6e4, entries };
    if (w.routine) out.routine = w.routine;
    if (w.note && w.note.trim()) out.note = w.note.trim(); else delete out.note;
    if (w.rating) out.rating = w.rating; else delete out.rating;
    S.workouts = [...S.workouts.filter(x => x.id !== w.id), out].sort((a, b) => b.start - a.start);
    if (w.isNew) {
      const p = S.plans.find(x => !x.done && x.date === w._date && ((w.routine && x.routine === w.routine) || x.name.trim().toLowerCase() === out.name.toLowerCase()));

    }
    editW = null; calTo(dstr(new Date(start))); expanded.add('d:' + out.id); save(); render(); window.scrollTo(0, 0);

  },
  'cal-prev': () => { const m = new Date(calMonth); calMonth = new Date(m.getFullYear(), m.getMonth() - 1, 1).getTime(); render(); },
  'cal-next': () => { const m = new Date(calMonth); calMonth = new Date(m.getFullYear(), m.getMonth() + 1, 1).getTime(); render(); },
  'hist-more': () => { histLimit += 30; render(); },
  'cal-today': () => { calTo(todayStr()); render(); },
  'cal-day': b => { calTo(b.dataset.d); render(); },
  'plan-new': () => openPlan(calSel),
  'plan-add': b => {
    const r = b.dataset.r ? S.routines.find(x => x.id === b.dataset.r) : null;
    const name = r ? r.name : (($('#planname') || {}).value || '').trim();
    if (!name) { toast('Pick a routine or type a name'); return; }
    if (planCfg.rep && !planCfg.days.length) { toast('Pick at least one day'); return; }
    const dates = planDates(), series = planCfg.rep ? uid() : null;
    for (const date of dates) S.plans.push({ id: uid(), date, routine: r ? r.id : null, name, ...(series ? { series } : {}) });
    save(); closeSheet(); render();
    toast(series ? `Planned ${dates.length} workouts over ${planCfg.weeks === 26 ? '6 months' : planCfg.weeks + ' weeks'}` : `Planned for ${new Date(dateTs(planDate)).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`);
  },
  'plan-start': b => {
    const p = S.plans.find(x => x.id === b.dataset.id); if (!p) return;
    const r = p.routine ? S.routines.find(x => x.id === p.routine) || null : null;
    startWorkout(r, p);
    if (p.routine && !r && S.active) toast('That plan’s routine was deleted, so add exercises as you go');
  },
  'plan-rep': b => { planCfg.rep = b.dataset.v === '1'; openPlan(planDate, true); },
  'plan-dow': b => { const k = +b.dataset.v; planCfg.days = planCfg.days.includes(k) ? planCfg.days.filter(x => x !== k) : [...planCfg.days, k]; openPlan(planDate, true); },
  'plan-weeks': b => { planCfg.weeks = +b.dataset.v; openPlan(planDate, true); },
  'plan-del': b => {
    const p = S.plans.find(x => x.id === b.dataset.id); if (!p) return;
    if (!p.series) { S.plans = S.plans.filter(x => x.id !== p.id); save(); render(); toast('Plan removed'); return; }
    const later = S.plans.filter(x => x.series === p.series && x.date >= p.date && !x.done).length;
    openSheet(`${head('Remove plan')}<p>“${esc(p.name)}” repeats weekly. What would you like to remove?</p>
      <button class="btn wide" data-a="plan-del-one" data-id="${p.id}">Just ${esc(new Date(dateTs(p.date)).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }))}</button>
      <button class="btn danger-fill wide" data-a="plan-del-rest" data-id="${p.id}">This one and all ${later - 1 > 0 ? `${later - 1} later ` : 'later '}${later - 1 === 1 ? 'one' : 'ones'}</button>
      <button class="btn ghost wide" data-a="close-sheet">Cancel</button>`);
  },
  'plan-del-one': b => { S.plans = S.plans.filter(x => x.id !== b.dataset.id); save(); closeSheet(); render(); toast('Plan removed'); },
  'plan-del-rest': b => {
    const p = S.plans.find(x => x.id === b.dataset.id); if (!p) return;
    const n = S.plans.filter(x => x.series === p.series && x.date >= p.date && !x.done).length;
    S.plans = S.plans.filter(x => !(x.series === p.series && x.date >= p.date && !x.done)); save(); closeSheet(); render(); toast(`Removed ${n} planned ${n === 1 ? 'workout' : 'workouts'}`);
  },
  'save-as-routine': b => {
    const w = S.workouts.find(x => x.id === b.dataset.id); if (!w) return;
    S.routines.push({ id: uid(), name: w.name, items: [...new Set(w.entries.map(e => e.ex))] }); save();
    toast(`Saved “${w.name}” as a routine`);
  },
  'del-workout': b => { const id = b.dataset.id; askConfirm('This removes the workout from your history and charts.', 'Delete workout', () => { S.workouts = S.workouts.filter(w => w.id !== id); S.plans.forEach(p => { if (p.done === id) delete p.done; }); save(); render(); }); },
  metric: b => { prog.metric = b.dataset.v; prog.sel = null; render(); },
  'pt-sel': b => { prog.sel = +b.dataset.k; render(); },
  'bw-log': () => {
    const date = $('#bwdate').value, w = num($('#bwval').value);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast('Pick a date first'); return; }
    if (!(w > 0)) { toast('Enter your weight first'); $('#bwval').focus(); return; }
    const ex = S.bodyweight.find(e => e.date === date);
    if (ex) { ex.w = w; ex.u = S.settings.unit; } else S.bodyweight.push({ id: uid(), date, w, u: S.settings.unit });
    save(); render(); toast(ex ? 'Weight updated for that day' : 'Weight logged');
  },
  'bw-del': b => { S.bodyweight = S.bodyweight.filter(e => e.id !== b.dataset.id); save(); render(); toast('Entry deleted'); },
  'bw-all': () => { bwAll = !bwAll; render(); },
  units: () => openUnits(),
  'set-unit': b => { S.settings.unit = b.dataset.v; save(); openUnits(); render(); },
  'sample-add': () => {
    const n = addSamples(); prog.ex = null; prog.metric = null; prog.sel = null; save(); closeSheet(); go('progress');
    toast(`Added ${n} sample workouts`);
    addSamplePhotos().then(k => { if (k) { render(); toast(`Added ${n} sample workouts and ${k} sample photos`); } });
  },
  'sample-del': () => askConfirm('This removes the sample workouts, body weight entries and photos. Your own data stays.', 'Remove samples', () => { removeSamples(); prog.ex = null; prog.sel = null; save(); render(); toast('Sample workouts removed'); }),
  appearance: () => openAppearance(),
  tracking: () => openTracking(),
  'set-awake': b => { S.settings.keepAwake = b.dataset.v; save(); syncWake(); openTracking(); },
  'set-tsound': b => { S.settings.timerSound = b.dataset.v; save(); openTracking(); },
  'test-sound': () => testSound(),
  'set-pra': b => { S.settings.prAlerts = b.dataset.v === '1'; save(); openTracking(); },
  'set-photos': b => { S.settings.trackPhotos = b.dataset.v === '1'; if (!S.settings.trackPhotos) progView = 'charts'; save(); openTracking(); render(); },
  'prog-view': b => { progView = b.dataset.v; render(); },
  'ph-open': b => openPhoto(b.dataset.id),
  'ph-compare': () => openCompare(),
  'cmp-mode': b => { cmp.mode = b.dataset.v; openCompare(); },
  'ph-del': b => {
    const id = b.dataset.id;
    askConfirm('This permanently deletes the photo from this device.', 'Delete photo', () => {
      PhotoStore.del(id); photoURL.delete(id);
      S.photos = S.photos.filter(p => p.id !== id); save(); render(); toast('Photo deleted');
    });
  },
  library: () => openLibrary(),
  'lib-ex': b => openLibEx(b.dataset.id),
  'ex-type': b => { exEditType = b.dataset.v; document.querySelectorAll('[data-a="ex-type"]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); },
  'ex-save': b => {
    const id = b.dataset.id, ex = S.exercises.find(e => e.id === id); if (!ex) return;
    const name = ($('#exname').value || '').trim(), type = exEditType || ex.type;
    if (!name) { toast('Give the exercise a name'); return; }
    if (S.exercises.some(e => e.id !== id && !e.deleted && e.name.toLowerCase() === name.toLowerCase())) { toast('Another exercise already has that name'); return; }
    if (!typeOk(id, ex.type, type)) { toast('That type doesn’t fit the sets already logged'); return; }
    ex.name = name; ex.type = type; save(); render(); openLibEx(id); toast('Exercise updated');
  },
  'lib-add': b => {
    const inp = $('#libname'), name = (inp ? inp.value : '').trim(), t = b.dataset.t;
    if (!name) { toast('Type a name first'); if (inp) inp.focus(); return; }
    if (S.exercises.some(e => !e.deleted && e.type === t && e.name.toLowerCase() === name.toLowerCase())) { toast('That’s already in your library'); return; }
    addExercise(name, t); save(); openLibrary(); toast(`Added ${name}`);
  },
  'lib-del': b => {
    const id = b.dataset.id, ex = exById(id);
    askConfirm(`Delete ${ex.name} from your library? It’s also taken out of your routines. Past workouts keep their history.`, 'Delete exercise', () => {
      ex.deleted = true;
      S.routines.forEach(r => { r.items = r.items.filter(i => i !== id); });
      if (draft) draft.items = draft.items.filter(i => i !== id);
      save(); render(); openLibrary(); toast(`Deleted ${ex.name}`);
    });
  },
  'set-bw': b => { S.settings.trackBW = b.dataset.v === '1'; save(); openTracking(); render(); },
  'set-accent': b => { S.settings.accent = b.dataset.v; save(); applyTheme(); const y = $('#sheet').scrollTop; openAppearance(); $('#sheet').scrollTop = y; },
  'set-theme': b => { S.settings.theme = b.dataset.v; save(); applyTheme(); openAppearance(); },
  'set-hround': b => { S.settings.hintRound = b.dataset.v; save(); openUnits(); render(); },
  'set-dist': b => { S.settings.dist = b.dataset.v; save(); openUnits(); render(); },
  csv: () => exportCSV(),
  'csv-copy': () => { const t = buildCSV().slice(1); (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Spreadsheet data copied'), () => toast('Select the text below and copy it')); },
  'backup-page': () => openBackup(),
  'bk-later': () => { S.backupSnooze = Date.now() + 3 * 864e5; save(); render(); toast('We’ll remind you again in a few days'); },
  'bk-photos': b => { S.settings.backupPhotos = b.dataset.v === '1'; save(); openBackup(); },
  'bk-notes': async () => {
    const text = await buildBackup(false);
    try { if (navigator.share) { await navigator.share({ title: 'Baby Food backup', text }); markBackedUp(); toast('Backup saved'); return; } }
    catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text); markBackedUp(); toast('Backup copied. Open Notes and paste it.'); }
    catch (e) { openSheet(`${subHead('Your backup', 'backup-page', 'Backup')}<p class="note">Select all of this text, copy it, and paste it into a note.</p><textarea class="field area" rows="9" readonly aria-label="Backup text">${esc(text)}</textarea>`); markBackedUp(); }
  },
  'bk-file': async () => {
    const withPhotos = !!S.settings.backupPhotos && S.photos.some(x => !x.sample);
    if (withPhotos) toast('Preparing backup…');
    const json = await buildBackup(withPhotos), name = `baby-food-backup-${todayStr()}.json`;
    try {
      const file = new File([json], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Baby Food backup' }); markBackedUp(); toast('Backup saved'); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { const a = document.createElement('a'); a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(json); a.download = name; document.body.appendChild(a); a.click(); a.remove(); markBackedUp(); toast('Backup file downloaded'); }
    catch (e) { toast('Couldn’t save a file here. Try Save to Notes instead.'); }
  },
  restore: () => openSheet(`${subHead('Restore', 'backup-page', 'Backup')}<p class="note">Paste a backup you saved in Notes. It replaces everything currently on this phone.</p><textarea id="rtext" class="field area" rows="8" placeholder="Paste your backup here" aria-label="Backup text"></textarea><button class="btn primary wide" data-a="do-restore">Restore backup</button>`),
  'do-restore': () => doRestore($('#rtext').value),
  erase: () => askConfirm('This deletes every workout, body weight entry, progress photo, routine and setting on this device.', 'Erase everything', () => { PhotoStore.clear(); photoURL.clear(); S = fresh(); draft = null; doneUntil = 0; save(); applyTheme(); go('log'); toast('All data erased'); }),
  't-plus': () => { unlockAudio(); if (!S.timer) return; S.timer.end += 15000; S.timer.total = Math.max(S.timer.total, S.timer.end - Date.now()); save(); tick(); },
  't-minus': () => { unlockAudio(); if (!S.timer) return; S.timer.end -= 15000; if (S.timer.end <= Date.now()) S.timer = null; save(); tick(); },
  't-skip': () => { unlockAudio(); S.timer = null; doneUntil = 0; save(); tick(); }
};

document.addEventListener('click', e => {
  if (wantWake() && !wakeSentinel) syncWake();
  if (e.target.id === 'backdrop') { closeSheet(); return; }
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const fn = A[b.dataset.a]; if (fn) fn(b, e);
});
const grow = t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; };
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset.f;
  if (t.id === 'pq') { $('#plist').innerHTML = pickerList(t.value); return; }
  if (t.id === 'pcw' || t.id === 'bwval' || t.id === 'pladd') { const m = t.value.replace(/[^\d.,]/g, '').match(/^(\d*)([.,]?)(\d{0,2})/), v = m ? m[1].slice(0, 4) + m[2] + m[3] : ''; if (v !== t.value) t.value = v; }
  if (t.id === 'pcw') { $('#pcout').innerHTML = plateResult(); return; }
  if (t.dataset.f === 'cmp-pos') { cmp.pos = +t.value; const v = $('.cmp-slide'); if (v) v.style.setProperty('--pos', cmp.pos + '%'); return; }
  if (f === 'set') {
    // Keep set fields to plain positive numbers: weights/distances/minutes allow 2 decimals, reps and seconds are whole numbers.
    const k = t.dataset.k, whole = k === 'r' || k === 'tm' || k === 'ts', maxInt = k === 'r' || k === 'ts' || k === 'tm' ? 3 : 4;
    const m = t.value.replace(whole ? /[^\d]/g : /[^\d.,]/g, '').match(whole ? /^(\d*)/ : /^(\d*)([.,]?)(\d{0,2})/);
    const v = m ? m[1].slice(0, maxInt) + (whole ? '' : (m[2] || '') + (m[3] || '')) : '';
    if (v !== t.value) t.value = v;
  }
  const W = curW();
  if (f === 'set' && W) { const en = W.entries[+t.dataset.i], s = en && en.sets[+t.dataset.j]; if (s) { s[t.dataset.k] = t.value; save(); } }
  else if (f === 'wname' && W) { W.name = t.value; save(); }
  else if (f === 'enote' && W) { const en = W.entries[+t.dataset.i]; if (en) { en.note = t.value; save(); } grow(t); }
  else if (f === 'wnote' && W) { W.note = t.value; save(); grow(t); }
  else if (editW && f === 'edate') editW._date = t.value;
  else if (editW && f === 'etime') editW._time = t.value;
  else if (editW && f === 'edur') editW._dur = t.value.replace(/[^\d]/g, '');
  else if (f === 'rname' && draft) draft.name = t.value;
});
document.addEventListener('change', e => {
  const t = e.target, f = t.dataset.f;
  if (t.id === 'phfile') { handlePhoto(t); return; }
  if (t.id === 'rfile') { const file = t.files && t.files[0]; t.value = ''; if (file) { const r = new FileReader(); r.onload = () => doRestore(r.result); r.onerror = () => toast('Couldn’t read that file'); r.readAsText(file); } return; }
  if (f === 'remind') { S.settings.remind = +t.value; save(); render(); return; }
  if (f === 'pl-on' && psUnit) { const v = +t.dataset.v, cur = S.settings.plates[psUnit].filter(x => x !== v); if (t.checked) cur.push(v); S.settings.plates[psUnit] = cur; save(); return; }
  if (f === 'cmp-a' || f === 'cmp-b') { cmp[f === 'cmp-a' ? 'a' : 'b'] = t.value; if (cmp.a === cmp.b) cmp[f === 'cmp-a' ? 'b' : 'a'] = null; openCompare(); return; }
  if (f === 'goal') { S.settings.goal = +t.value; save(); render(); return; }
  if (f === 'rest') { S.settings.rest = +t.value; save(); render(); }
  else if (f === 'auto') { S.settings.autoRest = t.checked; save(); }
  else if (f === 'pex') { prog.ex = t.value; prog.metric = null; prog.sel = null; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#backdrop').hidden) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'bwval') { e.preventDefault(); A['bw-log'](); }
  if (e.key === 'Enter' && e.target.id === 'pq') { e.preventDefault(); const first = document.querySelector('#plist [data-a="pick"]'); if (first) first.click(); }
});

applyTheme();
setInterval(tick, 250);
setInterval(() => { const el = $('#elapsed'); if (el && S.active) el.textContent = fmtClock(Date.now() - S.active.start); }, 1000);
render();
})();
</script>

if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
